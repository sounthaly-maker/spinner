<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Random Spinner</title>
<style>
:root {
  --ink:#10213a; --muted:#6d7a90; --line:#e5ebf4;
  --blue:#226ff2; --bg:#f5f8fd; --danger:#d83b57;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 8% 8%, #e9f3ff 0, transparent 27%),
    radial-gradient(circle at 94% 90%, #f2edff 0, transparent 24%),
    linear-gradient(180deg,#fbfdff,#f3f7fd);
  color:var(--ink);
}
button,input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
.app { max-width:1220px; margin:auto; padding:26px 18px 42px; }
.top {
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px;
}
.titleBlock { min-width:0; }
.titleLine { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.titleLine h1 {
  margin:0; font-size:clamp(28px,4vw,44px); letter-spacing:-.045em; line-height:1.05;
}
.subtitle { margin:7px 0 0; color:var(--muted); font-size:14px; }
.btn {
  border:0; border-radius:14px; padding:10px 15px; font-weight:850;
  cursor:pointer; transition:.16s transform,.16s box-shadow,.16s opacity;
}
.btn:hover { transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn.primary {
  color:white; background:linear-gradient(135deg,#2686ff,#6c54f6);
  box-shadow:0 9px 24px rgba(39,115,245,.22);
}
.btn.soft { background:white; border:1px solid var(--line); color:var(--ink); }
.btn.danger { background:#fff0f3; color:var(--danger); border:1px solid #ffd7df; }
.btn.small { padding:7px 10px; border-radius:10px; font-size:13px; }
.btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

.grid {
  display:grid; grid-template-columns:minmax(0,1.45fr) minmax(330px,.55fr); gap:20px;
}
.card {
  background:rgba(255,255,255,.94); border:1px solid var(--line);
  border-radius:26px; box-shadow:0 18px 48px rgba(47,72,116,.08);
}
.spinnerCard { padding:22px; display:flex; flex-direction:column; align-items:center; }
.wheelWrap {
  position:relative; width:min(700px,86vw); aspect-ratio:1; margin:4px auto 12px;
}
.pointer {
  position:absolute; z-index:40; left:50%; top:-7px; transform:translateX(-50%);
  width:0; height:0;
  border-left:23px solid transparent; border-right:23px solid transparent; border-top:44px solid #ff3f67;
  filter:drop-shadow(0 5px 3px rgba(0,0,0,.16));
}
.wheel {
  position:absolute; inset:0; border-radius:50%; overflow:hidden;
  border:10px solid white; box-shadow:0 18px 50px rgba(30,70,130,.18);
  transition:transform 4.6s cubic-bezier(.12,.72,.08,1);
}
.member {
  position:absolute; left:50%; top:50%; width:112px; text-align:center;
  transform-origin:0 0; z-index:5; pointer-events:none;
}
.member img {
  width:90px; height:90px; object-fit:cover; border-radius:50%;
  border:5px solid white; box-shadow:0 8px 18px rgba(15,35,70,.18);
}
.member .name {
  margin:-8px auto 0; width:max-content; max-width:112px;
  background:white; padding:5px 13px; border-radius:999px; font-weight:950; font-size:13px;
  box-shadow:0 6px 14px rgba(30,45,80,.15);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.spinBtn {
  position:absolute; z-index:30; left:50%; top:50%; transform:translate(-50%,-50%);
  width:132px; height:132px; border-radius:50%; border:9px solid white;
  background:linear-gradient(145deg,#228cff,#2455ed); color:white;
  font-size:26px; font-weight:950; letter-spacing:.03em;
  box-shadow:0 12px 30px rgba(38,95,235,.32); cursor:pointer;
}
.spinBtn:disabled { opacity:.55; cursor:not-allowed; }
.hint {
  color:var(--muted); font-size:13px; text-align:center; margin-top:2px;
}
.selectionSummary {
  margin-top:10px; padding:9px 12px; border-radius:999px;
  background:#f0f6ff; color:#37608d; font-size:13px; font-weight:800;
}

.side { padding:18px; }
.sideHead {
  display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;
}
.sideHead h2 { margin:0; font-size:20px; }
.bulkActions { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
.members { display:flex; flex-direction:column; gap:9px; max-height:670px; overflow:auto; padding-right:2px; }
.row {
  display:grid; grid-template-columns:auto 52px 1fr auto;
  align-items:center; gap:10px; border:1px solid var(--line);
  border-radius:17px; padding:9px; background:white; transition:.15s opacity,.15s background;
}
.row.out { opacity:.56; background:#f8fafc; }
.includeBox {
  width:20px; height:20px; accent-color:#2f7cf6; cursor:pointer;
}
.row img { width:52px; height:52px; border-radius:50%; object-fit:cover; }
.row b { display:block; }
.row span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
.badge {
  display:inline-block; margin-top:4px; padding:2px 7px; border-radius:999px;
  font-size:10px!important; font-weight:850;
}
.badge.in { color:#1d7850; background:#e9f9f0; }
.badge.out { color:#8a6570; background:#f7edf1; }
.rowActions { display:flex; gap:6px; }
.icon {
  border:0; background:#f3f6fb; border-radius:9px; padding:8px; cursor:pointer; font-weight:850;
}
.icon.red { color:#d43b53; background:#fff0f3; }
.empty { padding:35px 10px; text-align:center; color:var(--muted); }

.overlay {
  position:fixed; inset:0; background:rgba(12,27,50,.5);
  display:none; align-items:center; justify-content:center; padding:18px; z-index:100;
}
.overlay.open { display:flex; }
.modal {
  width:min(510px,95vw); background:white; border-radius:24px; padding:22px;
  box-shadow:0 28px 80px rgba(0,0,0,.24); max-height:92vh; overflow:auto;
}
.modal h3 { margin:0 0 15px; font-size:22px; }
.field { margin:10px 0; }
.field label {
  display:block; font-size:12px; font-weight:850; color:#58657a; margin-bottom:6px;
}
.field input[type="text"], .field input[type="file"] {
  width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; outline:none;
}
.field input:focus { border-color:#90b8ff; box-shadow:0 0 0 3px #eef4ff; }
.photoLine { display:flex; align-items:center; gap:12px; }
.photoPreview {
  width:78px; height:78px; border-radius:50%; object-fit:cover;
  border:4px solid #eef2f8; background:#eef2f8;
}
.actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }

.result { text-align:center; }
.result .emoji { font-size:40px; }
.result img {
  width:150px; height:150px; border-radius:50%; object-fit:cover;
  border:7px solid white; box-shadow:0 18px 44px rgba(24,65,130,.2); margin-top:5px;
}
.result h2 { font-size:34px; margin:10px 0 2px; }
.result p { margin:0; color:var(--muted); }
.result .actions { justify-content:center; margin-top:18px; }

.confetti {
  position:fixed; top:-20px; width:10px; height:16px; border-radius:2px;
  z-index:160; pointer-events:none; animation:fall 2s linear forwards;
}
@keyframes fall {
  to { transform:translate(var(--x),105vh) rotate(720deg); opacity:.85; }
}
.toast {
  position:fixed; left:50%; bottom:25px; transform:translateX(-50%);
  background:#15233a; color:white; padding:10px 14px; border-radius:12px;
  font-weight:750; display:none; z-index:200;
}
.toast.show { display:block; }

@media(max-width:880px) {
  .grid { grid-template-columns:1fr; }
  .wheelWrap { width:min(680px,90vw); }
}
@media(max-width:540px) {
  .app { padding:14px 10px 26px; }
  .top { align-items:flex-start; }
  .top > .btn { flex-shrink:0; }
  .subtitle { font-size:12px; }
  .spinnerCard { padding:12px; }
  .member { width:86px; }
  .member img { width:64px; height:64px; border-width:4px; }
  .member .name { max-width:86px; font-size:10px; padding:4px 8px; }
  .spinBtn { width:96px; height:96px; border-width:7px; font-size:19px; }
  .pointer { border-left-width:18px; border-right-width:18px; border-top-width:34px; }
  .row { grid-template-columns:auto 48px 1fr auto; }
  .row img { width:48px; height:48px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="titleBlock">
      <div class="titleLine">
        <h1 id="pageTitle">Team Random Spinner 🎡</h1>
        <button class="btn soft small" id="editTitleBtn">✎ Edit Title</button>
      </div>
      <p class="subtitle">Choose who joins the spin, cut finished members out, and bring them back anytime.</p>
    </div>
    <button class="btn primary" id="addMemberTop">＋ Add Member</button>
  </div>

  <div class="grid">
    <section class="card spinnerCard">
      <div class="wheelWrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <button class="spinBtn" id="spinBtn">SPIN</button>
      </div>
      <div class="hint">Only checked members are included. The popup always matches the person under the pointer.</div>
      <div class="selectionSummary" id="selectionSummary">6 members selected</div>
    </section>

    <aside class="card side">
      <div class="sideHead">
        <h2>Members <span id="count"></span></h2>
        <button class="btn soft small" id="resetBtn">Reset</button>
      </div>
      <div class="bulkActions">
        <button class="btn soft small" id="selectAllBtn">✓ Select All</button>
        <button class="btn soft small" id="clearAllBtn">Clear All</button>
      </div>
      <div class="members" id="members"></div>
    </aside>
  </div>
</div>

<div class="overlay" id="titleOverlay">
  <div class="modal">
    <h3>Edit spinner title</h3>
    <div class="field">
      <label>Title</label>
      <input id="titleInput" type="text" maxlength="80" placeholder="e.g. Who will present today?">
    </div>
    <div class="actions">
      <button class="btn soft" id="cancelTitle">Cancel</button>
      <button class="btn primary" id="saveTitle">Save Title</button>
    </div>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3 id="editTitle">Add member</h3>
    <div class="photoLine">
      <img class="photoPreview" id="photoPreview" alt="">
      <div class="field" style="flex:1">
        <label>Profile image</label>
        <input id="photoInput" type="file" accept="image/*">
      </div>
    </div>
    <div class="field"><label>Name</label><input id="nameInput" type="text" placeholder="Member name"></div>
    <div class="field"><label>Position (optional)</label><input id="positionInput" type="text" placeholder="e.g. Developer"></div>
    <div class="actions">
      <button class="btn soft" id="cancelEdit">Cancel</button>
      <button class="btn primary" id="saveMember">Save Member</button>
    </div>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="modal result">
    <div class="emoji">🎉✨🎊</div>
    <img id="resultPhoto" alt="">
    <h2 id="resultName"></h2>
    <p id="resultPosition"></p>
    <div class="actions">
      <button class="btn soft" id="keepMember">Keep in Spinner</button>
      <button class="btn primary" id="spinAgain">Spin Again</button>
      <button class="btn danger" id="cutWinner">Cut from Spinner</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const INITIAL_TITLE = "Team Random Spinner 🎡";
const PALETTE = ["#2292F4","#FF5A78","#FFC72E","#8757EE","#43C979","#FF992E","#24C9C5","#F26EB0","#7CB342","#FF7043"];

let state = loadState();
let rotation = 0;
let spinning = false;
let editingId = null;
let selectedId = null;
let pendingPhoto = null;

const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");

function deepClone(v) {
  return JSON.parse(JSON.stringify(v));
}

function defaultState() {
  return { title: INITIAL_TITLE, members: deepClone(INITIAL_MEMBERS) };
}

function loadState() {
  try {
    const raw = localStorage.getItem("teamSpinnerFullStateV1");
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.members)) return defaultState();

    parsed.title = (parsed.title || INITIAL_TITLE).toString();
    parsed.members = parsed.members.map((m, i) => ({
      id: m.id ?? Date.now() + i,
      name: m.name || "Member",
      position: m.position || "",
      photo: m.photo || placeholderAvatar(m.name || "M"),
      color: m.color || PALETTE[i % PALETTE.length],
      included: m.included !== false
    }));
    return parsed;
  } catch (e) {
    return defaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem("teamSpinnerFullStateV1", JSON.stringify(state));
  } catch (e) {
    showToast("Browser storage is full. Changes still work in this tab.");
  }
}

function escapeHtml(value) {
  const d = document.createElement("div");
  d.textContent = value || "";
  return d.innerHTML;
}

function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function getIncludedMembers() {
  return state.members.filter(m => m.included);
}

function renderTitle() {
  document.getElementById("pageTitle").textContent = state.title || INITIAL_TITLE;
  document.title = state.title || "Team Random Spinner";
}

function render() {
  renderTitle();
  const included = getIncludedMembers();
  const count = document.getElementById("count");
  count.textContent = "(" + state.members.length + ")";
  document.getElementById("selectionSummary").textContent =
    included.length + (included.length === 1 ? " member selected" : " members selected");

  spinBtn.disabled = spinning || included.length === 0;

  const list = document.getElementById("members");

  if (!included.length) {
    wheel.style.background = "#eef2f7";
    wheel.innerHTML =
      '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#8290a7;font-weight:850;text-align:center;padding:30px">Choose at least one member</div>';
  } else {
    const seg = 360 / included.length;
    const stops = [];
    included.forEach((m, i) => {
      stops.push((m.color || PALETTE[i % PALETTE.length]) + " " + (i * seg) + "deg " + ((i + 1) * seg) + "deg");
    });
    wheel.style.background = "conic-gradient(" + stops.join(",") + ")";
    wheel.innerHTML = "";

    const radius = Math.max(104, Math.min(250, wheel.clientWidth * 0.37));
    included.forEach((m, i) => {
      const center = i * seg + seg / 2;
      const visual = center - 90;
      const el = document.createElement("div");
      el.className = "member";
      el.style.transform =
        "rotate(" + visual + "deg) translate(" + radius + "px) rotate(" + (-visual) + "deg) translate(-50%,-50%)";
      el.innerHTML =
        '<img src="' + m.photo + '" alt=""><div class="name">' + escapeHtml(m.name) + "</div>";
      wheel.appendChild(el);
    });
  }

  if (!state.members.length) {
    list.innerHTML = '<div class="empty">No members yet.<br>Add someone to start spinning.</div>';
    return;
  }

  list.innerHTML = state.members.map(m => {
    const status = m.included
      ? '<span class="badge in">IN SPINNER</span>'
      : '<span class="badge out">CUT OUT</span>';

    return '<div class="row ' + (m.included ? "" : "out") + '">' +
      '<input class="includeBox" type="checkbox" data-include="' + m.id + '" ' + (m.included ? "checked" : "") + ' title="Include in spinner">' +
      '<img src="' + m.photo + '" alt="">' +
      '<div><b>' + escapeHtml(m.name) + '</b><span>' + (escapeHtml(m.position) || "No position") + '</span>' + status + '</div>' +
      '<div class="rowActions">' +
        '<button class="icon" data-edit="' + m.id + '" title="Edit">✎</button>' +
        '<button class="icon red" data-delete="' + m.id + '" title="Delete permanently">🗑</button>' +
      '</div>' +
    '</div>';
  }).join("");

  list.querySelectorAll("[data-include]").forEach(box => {
    box.onchange = () => {
      const id = Number(box.dataset.include);
      const m = state.members.find(x => x.id === id);
      if (!m) return;
      m.included = box.checked;
      saveState();
      resetWheelRotation();
      render();
    };
  });

  list.querySelectorAll("[data-edit]").forEach(b => {
    b.onclick = () => openEdit(Number(b.dataset.edit));
  });

  list.querySelectorAll("[data-delete]").forEach(b => {
    b.onclick = () => deleteMember(Number(b.dataset.delete));
  });
}

window.addEventListener("resize", () => requestAnimationFrame(render));

function resetWheelRotation() {
  rotation = 0;
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";
  void wheel.offsetWidth;
  wheel.style.transition = "transform 4.6s cubic-bezier(.12,.72,.08,1)";
}

function randomIndex(max) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function spin() {
  const included = getIncludedMembers();
  if (spinning || included.length === 0) return;

  spinning = true;
  selectedId = null;
  spinBtn.disabled = true;

  const seg = 360 / included.length;
  const target = randomIndex(included.length);
  const center = target * seg + seg / 2;

  const desired = ((360 - center) % 360 + 360) % 360;
  const current = ((rotation % 360) + 360) % 360;
  const delta = (desired - current + 360) % 360;

  rotation += 5 * 360 + delta;
  wheel.style.transform = "rotate(" + rotation + "deg)";

  setTimeout(() => {
    const freshIncluded = getIncludedMembers();
    if (!freshIncluded.length) {
      spinning = false;
      render();
      return;
    }

    const freshSeg = 360 / freshIncluded.length;
    const pointerAngle = (((-rotation) % 360) + 360) % 360;
    let actual = Math.floor(pointerAngle / freshSeg) % freshIncluded.length;
    if (actual < 0) actual += freshIncluded.length;

    const winner = freshIncluded[actual];
    selectedId = winner.id;
    spinning = false;
    spinBtn.disabled = false;
    showResult(winner);
  }, 4700);
}

spinBtn.onclick = spin;

function showResult(m) {
  document.getElementById("resultPhoto").src = m.photo;
  document.getElementById("resultName").textContent = m.name;
  document.getElementById("resultPosition").textContent = m.position || "Selected team member";
  document.getElementById("resultOverlay").classList.add("open");
  confetti();
}

function confetti() {
  const cs = ["#ff5577","#1f8cff","#ffd02c","#6e5cff","#42c878","#ff8e35"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = (Math.random() * 100) + "vw";
    c.style.background = cs[i % cs.length];
    c.style.setProperty("--x", (Math.random() * 260 - 130) + "px");
    c.style.animationDelay = (Math.random() * .5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

document.getElementById("keepMember").onclick = () => {
  document.getElementById("resultOverlay").classList.remove("open");
};

document.getElementById("spinAgain").onclick = () => {
  document.getElementById("resultOverlay").classList.remove("open");
  setTimeout(spin, 120);
};

document.getElementById("cutWinner").onclick = () => {
  if (selectedId == null) return;
  const m = state.members.find(x => x.id === selectedId);
  if (!m) return;
  m.included = false;
  saveState();
  document.getElementById("resultOverlay").classList.remove("open");
  resetWheelRotation();
  render();
  showToast(m.name + " cut from spinner");
};

function placeholderAvatar(name) {
  const letter = (name || "?").trim().charAt(0).toUpperCase() || "?";
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
    '<rect width="100%" height="100%" rx="150" fill="#eaf0f9"/>' +
    '<text x="50%" y="58%" text-anchor="middle" fill="#60708a" font-family="Arial" font-size="120" font-weight="700">' +
    letter + '</text></svg>'
  );
}

function openAdd() {
  editingId = null;
  pendingPhoto = null;
  document.getElementById("editTitle").textContent = "Add member";
  document.getElementById("nameInput").value = "";
  document.getElementById("positionInput").value = "";
  document.getElementById("photoInput").value = "";
  document.getElementById("photoPreview").src = placeholderAvatar("+");
  document.getElementById("editOverlay").classList.add("open");
}

function openEdit(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  pendingPhoto = m.photo;
  document.getElementById("editTitle").textContent = "Edit member";
  document.getElementById("nameInput").value = m.name;
  document.getElementById("positionInput").value = m.position || "";
  document.getElementById("photoInput").value = "";
  document.getElementById("photoPreview").src = m.photo;
  document.getElementById("editOverlay").classList.add("open");
}

function deleteMember(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  if (!confirm("Delete " + m.name + " permanently?")) return;
  state.members = state.members.filter(x => x.id !== id);
  saveState();
  resetWheelRotation();
  render();
  showToast(m.name + " deleted");
}

document.getElementById("addMemberTop").onclick = openAdd;
document.getElementById("cancelEdit").onclick = () => document.getElementById("editOverlay").classList.remove("open");

document.getElementById("photoInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 320;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      pendingPhoto = canvas.toDataURL("image/jpeg", .82);
      document.getElementById("photoPreview").src = pendingPhoto;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById("saveMember").onclick = () => {
  const name = document.getElementById("nameInput").value.trim();
  const position = document.getElementById("positionInput").value.trim();

  if (!name) {
    showToast("Please enter a name");
    return;
  }

  if (editingId) {
    const idx = state.members.findIndex(x => x.id === editingId);
    if (idx >= 0) {
      state.members[idx] = {
        ...state.members[idx],
        name,
        position,
        photo: pendingPhoto || state.members[idx].photo
      };
    }
  } else {
    state.members.push({
      id: Date.now(),
      name,
      position,
      photo: pendingPhoto || placeholderAvatar(name),
      color: PALETTE[state.members.length % PALETTE.length],
      included: true
    });
  }

  saveState();
  document.getElementById("editOverlay").classList.remove("open");
  resetWheelRotation();
  render();
  showToast("Member saved");
};

document.getElementById("selectAllBtn").onclick = () => {
  state.members.forEach(m => m.included = true);
  saveState();
  resetWheelRotation();
  render();
  showToast("All members selected");
};

document.getElementById("clearAllBtn").onclick = () => {
  state.members.forEach(m => m.included = false);
  saveState();
  resetWheelRotation();
  render();
  showToast("All members cleared");
};

document.getElementById("editTitleBtn").onclick = () => {
  document.getElementById("titleInput").value = state.title || INITIAL_TITLE;
  document.getElementById("titleOverlay").classList.add("open");
  setTimeout(() => document.getElementById("titleInput").focus(), 50);
};

document.getElementById("cancelTitle").onclick = () => {
  document.getElementById("titleOverlay").classList.remove("open");
};

document.getElementById("saveTitle").onclick = () => {
  const value = document.getElementById("titleInput").value.trim();
  state.title = value || INITIAL_TITLE;
  saveState();
  document.getElementById("titleOverlay").classList.remove("open");
  renderTitle();
  showToast("Title saved");
};

document.getElementById("titleInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("saveTitle").click();
});

document.getElementById("resetBtn").onclick = () => {
  if (!confirm("Reset title and members to the original setup?")) return;
  state = defaultState();
  saveState();
  resetWheelRotation();
  render();
  showToast("Spinner reset");
};

document.querySelectorAll(".overlay").forEach(o => {
  o.addEventListener("click", e => {
    if (e.target === o) o.classList.remove("open");
  });
});

render();
</script>
</body>
</html>
